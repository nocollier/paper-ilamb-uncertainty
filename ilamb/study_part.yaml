Uncertainty:
  Latent Heat:
    CLASS-1-1:
      sources:
        hfls: CLASS-1-1/obs4MIPs_UNSW_CLASS-1-1_mon_hfls_gn_v20260302.nc
      analyses:
        - bias
        - rmse
      use_uncertainty: true

  Sensible Heat:
    CLASS-1-1:
      sources:
        hfss: CLASS-1-1/obs4MIPs_UNSW_CLASS-1-1_mon_hfss_gn_v20260302.nc
      analyses:
        - bias
        - rmse
      use_uncertainty: true

  Precipitation:
    CLASS-1-1:
      sources:
        pr: CLASS-1-1/obs4MIPs_UNSW_CLASS-1-1_mon_pr_gn_v20260302.nc
      analyses:
        - bias
        - rmse
      use_uncertainty: true

  Surface Net Radiation:
    CLASS-1-1:
      sources:
        rns: CLASS-1-1/obs4MIPs_UNSW_CLASS-1-1_mon_rns_gn_v20260302.nc
      analyses:
        - bias
        - rmse
      transforms:
        - expression:
            expr: "rns = rlds - rlus + rsds - rsus"
      use_uncertainty: true

  Runoff:
    CLASS-1-1:
      sources:
